<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- Icono del sitio. Next lo detecta por convencion desde app/icon.svg y
       emite la etiqueta <link rel="icon">, con lo que el navegador deja de
       pedir /favicon.ico y de registrar el 404.

       Tres barras ascendentes: la primera en el azul de Comercializadora, la
       ultima en el escarlata de Acabados, la de en medio neutra. El grupo
       contiene a las dos empresas sin ser ninguna, que es el mismo criterio
       de la pantalla de acceso.

       Colores fijos y no variables CSS: un favicon se pinta fuera del
       documento y no hereda el tema. -->
  <rect width="64" height="64" rx="14" fill="#0A1628"/>
  <rect x="13" y="34" width="10" height="17" rx="2.5" fill="#6BA5E8"/>
  <rect x="27" y="24" width="10" height="27" rx="2.5" fill="#E8EDF5"/>
  <rect x="41" y="14" width="10" height="37" rx="2.5" fill="#F0605B"/>
</svg>
